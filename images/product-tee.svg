<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t">
  <title id="t">Oversized Cover Tee — The Common Athlete</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3d8c6"/>
      <stop offset="1" stop-color="#cdbfa6"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f1"/>
      <stop offset="1" stop-color="#efe7d9"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.78" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#sheen)"/>

  <!-- oversized tee -->
  <path d="M 322 318 C 360 306 440 306 478 318 L 500 332 L 588 372
           C 600 378 604 392 598 405 L 556 496 L 512 478 L 518 700
           C 518 710 510 716 500 716 L 300 716 C 290 716 282 710 282 700
           L 288 478 L 244 496 L 202 405 C 196 392 200 378 212 372
           L 300 332 Z"
        fill="url(#cloth)" stroke="#ddd0bc" stroke-width="2"/>
  <!-- collar -->
  <path d="M 322 318 C 360 348 440 348 478 318" fill="none" stroke="#d8cbb8" stroke-width="3"/>
  <!-- sleeve seams -->
  <path d="M 300 332 L 288 478" fill="none" stroke="#e3d6c2" stroke-width="1.5" opacity="0.7"/>
  <path d="M 500 332 L 512 478" fill="none" stroke="#e3d6c2" stroke-width="1.5" opacity="0.7"/>

  <!-- wordmark across chest -->
  <text x="400" y="486" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="4" fill="#5B4636">THE COMMON ATHLETE</text>

  <text x="56" y="80" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700"
        letter-spacing="3" fill="#5B4636" opacity="0.8">03</text>
  <text x="56" y="950" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600"
        letter-spacing="2.5" fill="#5B4636" opacity="0.8">OVERSIZED COVER TEE</text>
</svg>
